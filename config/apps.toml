# Omivoid application roles — portable defaults
# docs/12-configuration-layout.md §6, docs/03-action-registry-spec.md §26
#
# Application actions resolve roles rather than hard-coded executables.
# Values below are portable defaults; users may override through
# ~/.config/omivoid/apps.toml (user configuration wins).
#
# Values established by the environment audit (docs/implementation/environment-audit.md §9).

[apps]
terminal = "alacritty"
browser = "librewolf"
files = "nemo"
editor = "nvim"
notes = "obsidian"
mail = "thunderbird"
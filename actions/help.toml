# Omivoid action registry — help
# Schema version 1 (docs/03-action-registry-spec.md)
# Help actions are core Phase 1 actions (docs/04 §12).

registry_version = 1

[group.help]

name = "Help"
prefix = "Super+K"
description = "Help and interaction discovery"

[action."help.keys.open"]

name = "Open Interaction Explorer"
description = "Open the interaction explorer showing available actions and bindings."
category = "Help"

keywords = ["help", "keys", "shortcuts", "explorer", "discover"]

keys = ["Super+K"]

# ADR-006 §12: Super+K is served through the DMS launcher provider.
# The Omivoid Actions plugin interprets a leading "!!" as "show all actions"
# (two characters because the DMS launcher ignores single-character queries
# in its plugin phase), so the spotlight opens as an interaction explorer /
# cheatsheet. The former Quickshell popup is retired.
adapter = "shell.explorer"
arguments = { command = ["dms", "ipc", "call", "spotlight", "openQuery", "!!"] }

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]

discoverable = true
palette = true
ai_accessible = false
voice_accessible = false

[action."help.actions.search"]

name = "Search Actions"
description = "Search and run any registered action from the universal palette."
category = "Help"

keywords = ["search", "palette", "actions", "run", "launcher"]

# Super+Space is claimed by DMS (spotlight launcher, dms-evaluation.md §4.2).
# The action maps to DMS spotlight; the Omivoid popup is retired for search.
keys = ["Super+Space"]

adapter = "command"
command = ["dms", "ipc", "call", "spotlight", "toggle"]

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]

discoverable = true
palette = true
ai_accessible = false
voice_accessible = false

[action."help.keybinds.open"]

name = "Open Keybindings Cheat Sheet"
description = "Open the read-only GKS keybindings cheat sheet (tabbed by domain)."
category = "Help"

keywords = ["keybindings", "keys", "cheatsheet", "shortcuts", "gks", "sheet"]

# Mod+Shift+K is claimed by DMS (move-window-up, dms/binds.kdl), so the cheat
# sheet uses Super+Shift+S, which is free. Opens the omivoidKeybinds DMS plugin.
keys = ["Super+Shift+S"]

adapter = "command"
command = ["dms", "ipc", "call", "omivoidKeybinds", "toggle"]

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]

discoverable = true
palette = true
ai_accessible = false
voice_accessible = false
# Ominty action registry — capture
# Schema version 1 (docs/03-action-registry-spec.md)
#
# Screenshots are provided by DMS (`dms screenshot …`), which already owns
# the Print-family keybindings in dms/binds.kdl (Print = region,
# Ctrl+Print = full, Alt+Print = window). These registry actions exist for
# discoverability, the palette and AI; they carry no keys so they do not
# duplicate the DMS bindings (AGENTS.md §14).

registry_version = 1

[action."capture.screenshot.full"]

name = "Capture Screenshot"
description = "Capture the focused output to a file."
category = "Capture"

keywords = ["screenshot", "capture", "screen", "full"]

keys = []

adapter = "command"
command = ["dms", "screenshot", "full"]

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]
requires = ["dms"]

discoverable = true
palette = true
ai_accessible = true
voice_accessible = false

[action."capture.screenshot.region"]

name = "Capture Region"
description = "Select a screen region and capture it."
category = "Capture"

keywords = ["screenshot", "capture", "region", "select"]

keys = []

adapter = "command"
command = ["dms", "screenshot", "region"]

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]
requires = ["dms"]

discoverable = true
palette = true
ai_accessible = true
voice_accessible = false

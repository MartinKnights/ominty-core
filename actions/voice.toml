# Ominty action registry — voice
# Schema version 1 (docs/03-action-registry-spec.md)
# docs/ai/11-voice-integration.md, ADR-007
#
# Speech-to-text (dictation) is local (whisper.cpp). TTS (voice.speak.*) is
# specified but not implemented yet; the existing Piper stack is unchanged.

registry_version = 1

[group.voice]

name = "Voice"
prefix = "Super+Alt+D"
description = "Voice and speech-to-text operations"


# Dictation is a toggle: Niri has no key-release bindings (ADR-007 §7), so the
# first press starts recording and the next stops, transcribes and injects the
# text into the focused window.
[action."voice.dictate"]

name = "Dictate"
description = "Start or stop dictation; the transcript is typed into the focused window."
category = "Voice"

keywords = ["voice", "dictate", "dictation", "speech", "stt", "microphone", "type"]

keys = ["Super+Alt+D"]

adapter = "voice.dictate"

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]
requires = ["whisper-cli", "ffmpeg", "pw-record", "wtype"]

discoverable = true
palette = true
# Dictation types text; it must not be reachable from the AI surface.
ai_accessible = false
voice_accessible = true


# Forced stop. No key of its own: `voice.dictate` toggles. This exists so the
# indicator, the CLI and future surfaces can abort a recording explicitly.
[action."voice.stop"]

name = "Stop Dictation"
description = "Stop recording without transcribing."
category = "Voice"

keywords = ["voice", "stop", "cancel", "dictation", "recording"]

keys = []

adapter = "voice.dictate"

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]

discoverable = true
palette = true
ai_accessible = false
voice_accessible = true


# Non-interactive: transcribe an audio file. No capture, no injection.
[action."voice.transcribe"]

name = "Transcribe Audio"
description = "Transcribe an audio file to text."
category = "Voice"

keywords = ["voice", "transcribe", "speech", "stt", "audio", "file"]

keys = []

adapter = "voice.transcribe"

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]
requires = ["whisper-cli", "ffmpeg"]

discoverable = true
palette = true
ai_accessible = false
voice_accessible = true


# Super+Alt+T: summon the dictation control panel (a mouse toggle — start or
# stop recording by clicking its button).
[action."voice.panel"]

name = "Dictation Panel"
description = "Show or hide the dictation control panel (mouse start/stop)."
category = "Voice"

keywords = ["voice", "panel", "dictate", "dictation", "control", "microphone", "mouse"]

keys = ["Super+Alt+T"]

adapter = "voice.panel"

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]

discoverable = true
palette = true
ai_accessible = false
voice_accessible = true


# ---------------------------------------------------------------------------
# Text to speech (Piper)
#
# The registry spec reserved `voice.speak.*` for this; the Piper stack already
# existed as scripts, so these actions only give it a stable, discoverable
# entry point and the desktop chords. Both are fire-and-forget: Niri has no
# key-release bindings, so the action queues speech and returns.
# ---------------------------------------------------------------------------

[action."voice.speak.file"]

name = "Read a document aloud"
description = "Pick a document (.md/.txt/.pdf/.docx/.epub) and read it aloud."
category = "Voice"

keywords = ["tts", "speak", "read", "aloud", "document", "piper", "voice", "file"]

keys = ["Super+Alt+O"]

adapter = "command"
command = ["tts-pick"]

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]
requires = ["zenity", "ominty"]

discoverable = true
palette = true
# Documents may be confidential: never route their text to an AI surface.
ai_accessible = false
voice_accessible = false


[action."voice.speak.clipboard"]

name = "Read the clipboard aloud"
description = "Speak the current clipboard contents with the local Piper voice."
category = "Voice"

keywords = ["tts", "speak", "clipboard", "read", "aloud", "piper", "voice"]

keys = ["Shift+Alt+S"]

adapter = "command"
command = ["read-selection", "--clipboard"]

risk = "routine"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]
requires = ["read-selection"]

discoverable = true
palette = true
ai_accessible = false
voice_accessible = false

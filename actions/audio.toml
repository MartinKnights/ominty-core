# Omivoid action registry — audio
# Schema version 1 (docs/03-action-registry-spec.md)
# Audio actions use DMS IPC (docs/07 §29, dms-evaluation.md §5).
# Media keys (XF86Audio*) are claimed by DMS and bound in its binds.kdl.

registry_version = 1

[action."audio.volume.increase"]

name = "Increase Volume"
description = "Increase the audio output volume."
category = "Audio"

keywords = ["volume", "up", "louder", "sound"]

keys = []

adapter = "dms.ipc"
arguments = { dms = { target = "audio", function = "increment", args = ["3"] } }

risk = "state-change"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]
requires = ["dms"]

discoverable = true
palette = true
ai_accessible = true
voice_accessible = false

[action."audio.volume.decrease"]

name = "Decrease Volume"
description = "Decrease the audio output volume."
category = "Audio"

keywords = ["volume", "down", "quieter", "sound"]

keys = []

adapter = "dms.ipc"
arguments = { dms = { target = "audio", function = "decrement", args = ["3"] } }

risk = "state-change"
confirmation = "never"

contexts = ["global"]
platforms = ["common"]
requires = ["dms"]

discoverable = true
palette = true
ai_accessible = true
voice_accessible = false

[action."audio.mute.toggle"]

name = "Toggle Audio Mute"
